<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login & Signup | Balaji Enterprises & Restaurant</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">B</div>
        <div class="brand-text-container">
          <span class="brand-title">Balaji Enterprises</span>
          <span class="brand-subtitle">& RESTAURANT • AMUL PARLOUR</span>
        </div>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/menu.html" class="nav-link">Full Menu</a></li>
          <li><a href="/orders.html" class="nav-link">Track Order</a></li>
        </ul>
      </nav>

      <div style="display: flex; align-items: center; gap: 1rem;">
        <div id="nav-auth-container"></div>
        <a href="/cart.html" class="cart-icon-btn" title="Shopping Cart">
          <span>🛒</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-content container" style="padding-top: 3rem;">
    <div class="summary-card" style="max-width: 480px; margin: 0 auto; padding: 2.5rem 2rem;">
      
      <!-- Tab Controls -->
      <div style="display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 1.5rem;">
        <button id="tab-login-btn" class="cat-btn active" style="flex: 1; border-radius: 0; border: none; padding: 0.75rem;" onclick="switchAuthTab('login')">
          Log In
        </button>
        <button id="tab-signup-btn" class="cat-btn" style="flex: 1; border-radius: 0; border: none; padding: 0.75rem;" onclick="switchAuthTab('signup')">
          Create Account
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <h2 style="font-size: 1.4rem; color: var(--text-dark); margin-bottom: 1rem;">Welcome Back</h2>
        
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="rahul.pandey@balaji.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem;">
          Log In
        </button>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
          Forgot password? Contact support at +91 9450867890
        </div>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" style="display: none;">
        <h2 style="font-size: 1.4rem; color: var(--text-dark); margin-bottom: 1rem;">Create Account</h2>
        
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name *</label>
          <input type="text" id="signup-name" class="form-control" placeholder="e.g. Ramesh Kumar" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-phone">Phone / WhatsApp Number *</label>
          <input type="tel" id="signup-phone" class="form-control" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="form-control" placeholder="yourname@gmail.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password *</label>
          <input type="password" id="signup-password" class="form-control" placeholder="At least 6 characters" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem;">
          Sign Up & Start Ordering
        </button>
      </form>

      <!-- Admin Provisioning Helper Accordion -->
      <div style="margin-top: 2rem; border-top: 1px dashed var(--border-color); padding-top: 1rem; text-align: center;">
        <button type="button" onclick="toggleAdminProvisioning()" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline;">
          🛠 Owner/Admin Account Provisioning Tool
        </button>
        <div id="admin-provision-box" style="display: none; text-align: left; margin-top: 1rem; background: var(--bg-subtle); padding: 1rem; border-radius: var(--radius-md); font-size: 0.85rem;">
          <strong>Grant Owner Admin Claim:</strong>
          <p style="margin: 0.4rem 0; color: var(--text-muted);">Assign owner custom claim role to <code>rahul.pandey@balaji.com</code>:</p>
          <div class="form-group" style="margin-bottom: 0.5rem;">
            <input type="email" id="admin-target-email" class="form-control" value="rahul.pandey@balaji.com" style="padding: 0.4rem; min-height: 36px;" />
          </div>
          <button type="button" class="btn btn-sm btn-outline" onclick="makeUserAdmin(this)">Set Role as Admin</button>
        </div>
      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const signupBtn = document.getElementById('tab-signup-btn');

      if (tab === 'login') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        loginBtn.classList.add('active');
        signupBtn.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        signupBtn.classList.add('active');
        loginBtn.classList.remove('active');
      }
    }

    let isLoggingIn = false;
    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isLoggingIn) return;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn ? submitBtn.innerHTML : 'Log In';

      isLoggingIn = true;
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Logging In...';
      }

      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      try {
        const user = await AuthManager.login(email, pass);
        // Check if admin or customer
        const idToken = await user.getIdTokenResult();
        if (idToken.claims.role === 'admin' || idToken.claims.admin === true || email === 'rahul.pandey@balaji.com') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/menu.html';
        }
      } catch (err) {
        isLoggingIn = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }
      }
    });

    let isSigningUp = false;
    document.getElementById('signup-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSigningUp) return;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn ? submitBtn.innerHTML : 'Sign Up & Start Ordering';

      isSigningUp = true;
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Signing Up...';
      }

      const name = document.getElementById('signup-name').value;
      const phone = document.getElementById('signup-phone').value;
      const email = document.getElementById('signup-email').value;
      const pass = document.getElementById('signup-password').value;
      try {
        await AuthManager.signUp(email, pass, name, phone);
        window.location.href = '/menu.html';
      } catch (err) {
        isSigningUp = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }

        if (err && err.code === 'auth/email-already-in-use') {
          const loginEmailInput = document.getElementById('login-email');
          if (loginEmailInput) {
            loginEmailInput.value = email;
          }
          switchAuthTab('login');
        }
      }
    });

    function toggleAdminProvisioning() {
      const box = document.getElementById('admin-provision-box');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    let isSettingAdmin = false;
    async function makeUserAdmin(btnElement) {
      if (isSettingAdmin) return;
      const btn = btnElement || document.querySelector('#admin-provision-box button');
      const originalText = btn ? btn.innerHTML : 'Set Role as Admin';

      const email = document.getElementById('admin-target-email').value;
      if (!email) return;

      isSettingAdmin = true;
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Setting Admin...';
      }

      try {
        if (window.functions) {
          const func = window.functions.httpsCallable('setUserRole');
          await func({ targetEmail: email, role: 'admin', secretKey: 'BALAJI_ADMIN_274001_SECRET' });
        } else if (window.db && window.auth.currentUser) {
          await window.db.collection('users').doc(window.auth.currentUser.uid).set({
            role: 'admin'
          }, { merge: true });
        }
        CartManager.showToast(`Admin claim requested for ${email}! Please re-login.`, 'success');
      } catch (e) {
        console.error(e);
        CartManager.showToast('Bootstrap failed: ' + e.message, 'error');
      } finally {
        isSettingAdmin = false;
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      }
    }
  </script>
</body>
</html>
