<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Balaji Enterprises & Restaurant Deoria</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">B</div>
        <div class="brand-text-container">
          <span class="brand-title">Balaji Enterprises</span>
          <span class="brand-subtitle">& RESTAURANT • AMUL PARLOUR</span>
        </div>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/menu.html" class="nav-link">Full Menu</a></li>
          <li><a href="/orders.html" class="nav-link">Track Order</a></li>
        </ul>
      </nav>

      <div style="display: flex; align-items: center; gap: 1rem;">
        <div id="nav-auth-container"></div>
        <a href="/cart.html" class="cart-icon-btn active" title="Shopping Cart">
          <span>🛒</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-content container" style="padding-top: 2.5rem;">
    <h1 style="font-size: 2rem; color: var(--text-dark); margin-bottom: 1.5rem;">Shopping Cart</h1>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
      <!-- Cart Items List -->
      <div id="cart-list-container">
        <!-- Rendered via JS -->
      </div>

      <!-- Summary & Proceed Card -->
      <div>
        <div class="summary-card" id="cart-summary-card">
          <h3 style="font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-dark);">Order Summary</h3>
          <div class="summary-row">
            <span>Item Subtotal</span>
            <span id="cart-subtotal">₹0</span>
          </div>
          <div class="summary-row">
            <span>Estimated Delivery Charge</span>
            <span id="cart-delivery">₹30</span>
          </div>
          <div class="summary-row total">
            <span>Grand Total</span>
            <span id="cart-grand-total" style="color: var(--primary-dark);">₹0</span>
          </div>

          <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
            <a href="/checkout.html" class="btn btn-primary btn-block" id="proceed-checkout-btn">
              Proceed to Checkout ➔
            </a>
            <a href="/menu.html" class="btn btn-outline btn-block">
              + Add More Items
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border: none;">
      &copy; 2026 Balaji Enterprises & Restaurant, Amul Parlour. Deoria, UP - 274001.
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    function renderCartPage() {
      const container = document.getElementById('cart-list-container');
      const cart = CartManager.getCart();

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="summary-card" style="text-align: center; padding: 3rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🛒</div>
            <h3 style="color: var(--text-dark); margin-bottom: 0.5rem;">Your Cart is Empty</h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Explore our delicious North Indian meals and Amul Ice Creams.</p>
            <a href="/menu.html" class="btn btn-primary">View Full Menu</a>
          </div>
        `;
        document.getElementById('cart-subtotal').textContent = '₹0';
        document.getElementById('cart-grand-total').textContent = '₹0';
        document.getElementById('proceed-checkout-btn').style.display = 'none';
        return;
      }

      document.getElementById('proceed-checkout-btn').style.display = 'block';

      container.innerHTML = cart.map(item => `
        <div class="summary-card" style="margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=1200&q=80'}" width="60" height="60" style="border-radius: var(--radius-md); object-fit: cover;" />
            <div>
              <h4 style="font-size: 1.05rem; color: var(--text-dark);">${item.name}</h4>
              <div style="font-weight: 700; color: var(--primary-dark);">₹${item.price} each</div>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 1.5rem;">
            <div class="stepper">
              <button class="stepper-btn" onclick="CartManager.updateQuantity('${item.itemId}', ${item.quantity - 1}); renderCartPage();">-</button>
              <span class="stepper-val">${item.quantity}</span>
              <button class="stepper-btn" onclick="CartManager.updateQuantity('${item.itemId}', ${item.quantity + 1}); renderCartPage();">+</button>
            </div>
            <div style="font-weight: 700; font-size: 1.1rem; min-width: 70px; text-align: right;">
              ₹${item.price * item.quantity}
            </div>
            <button onclick="CartManager.removeFromCart('${item.itemId}'); renderCartPage();" style="color: var(--status-cancelled); font-weight: 700; padding: 0.5rem;">✕</button>
          </div>
        </div>
      `).join('');

      const subtotal = CartManager.getCartTotal();
      const delivery = subtotal > 300 ? 0 : 30;
      document.getElementById('cart-subtotal').textContent = `₹${subtotal}`;
      document.getElementById('cart-delivery').textContent = delivery === 0 ? 'FREE' : `₹${delivery}`;
      document.getElementById('cart-grand-total').textContent = `₹${subtotal + delivery}`;
    }

    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>
</html>
