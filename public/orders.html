<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Orders | Balaji Enterprises & Restaurant Deoria</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">B</div>
        <div class="brand-text-container">
          <span class="brand-title">Balaji Enterprises</span>
          <span class="brand-subtitle">& RESTAURANT • AMUL PARLOUR</span>
        </div>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/menu.html" class="nav-link">Full Menu</a></li>
          <li><a href="/orders.html" class="nav-link active">Track Order</a></li>
        </ul>
      </nav>

      <div style="display: flex; align-items: center; gap: 1rem;">
        <div id="nav-auth-container"></div>
        <a href="/cart.html" class="cart-icon-btn" title="Shopping Cart">
          <span>🛒</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-content container" style="padding-top: 2.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-size: 2rem; color: var(--text-dark);">Live Order Tracking</h1>
        <p style="color: var(--text-muted);">Track kitchen preparation and delivery progress real-time</p>
      </div>

      <a href="/menu.html" class="btn btn-outline btn-sm">
        + Order More Food
      </a>
    </div>

    <!-- Active Orders Container -->
    <div id="orders-list-container">
      <!-- Populated via orders.js -->
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border: none;">
      &copy; 2026 Balaji Enterprises & Restaurant, Amul Parlour. Deoria, UP.
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/orders.js"></script>

</body>
</html>
